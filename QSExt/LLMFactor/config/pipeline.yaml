# 因子挖掘流水线 — 全局配置
#
# 此文件仅包含流水线级别的全局设置。
# 各阶段（Phase 1/2/3）的专属配置在各自的 YAML 文件中管理。

# 项目根目录
# "auto": 自动查找（QSExt/ 的父目录，要求含 .mcp.json）
# 绝对路径: 如 "D:\HST\QSExt"
# project_root: auto
project_root: "D:/HST/QSExt/local/workspace"

# Claude CLI 配置
# "auto": 从 PATH 或已知路径自动查找
# 绝对路径: 如 "C:\Users\xxx\.local\bin\claude.exe"
claude_cli: auto

# 挖掘环境的 Python 解释器（需已装 fastmcp / psycopg2）
# 留空或删除则回退到当前解释器
python: ""

# 运行时环境变量：注入流水线进程、Claude 子进程与 MCP 服务
#
# 本文件是模板，默认留空 —— 实际值由调用方提供，避免凭据入库：
#   * 经 QSWeb 运行时：值取自 ~/QuantStudioConfig/QSWebConfig.yaml 的
#     mining.frameworks.llm_factor.env，会覆盖此处（QSWeb 以自身配置为基底
#     生成运行时的 pipeline_config.yaml）
#   * 直接跑 QSExt 时：在此填入下面的变量，或用 shell / CI 注入进程环境变量
#
# 注意：POSTGRESQL_KDB_DSN_DEV 必须写展开后的完整连接串，不要用 ${VAR} 插值 ——
#       python-dotenv 的 interpolate=True 在变量缺失时会把 ${...} 原样留下，
#       产出一个含字面量的坏 DSN，且失败信息难以定位。
env: {}
# env:
#   POSTGRESQL_KDB_DSN_DEV: "postgresql://<user>:<pwd>@<host>:<port>/KDB_dev"
#   OLLAMA_BASE_URL: "http://127.0.0.1:11434"
#   OLLAMA_LLM_MODEL: "qwen3"

# 产出物输出基础目录
# 支持绝对路径或相对于项目根目录的路径
# 实际输出目录会自动追加 FM_<时间戳> 子目录
# 例: "workspace" → <项目根>/workspace/FM_20260710_143000/
workspace_dir: "D:/HST/QSExt/local/workspace"

# Agent 最大轮次（命令行参数 --max-turns-phase1/2 可覆盖）
max_turns_hypothesis: 50
max_turns_development: 80

# 数据上下文（构建因子对象和评测参数时使用）
data:
  trade_day_start: "2000-01-01"
  trade_day_end: "2025-12-31"
  stock_date: "2025-06-30"
  max_stocks: 1000
