# 假设生成阶段配置
#
# 字段直接对应 ResearchConfig，详见 hypothesis/config.py

market: "A股"
frequency: "日频"

# 搜索预算
max_directions: 5
max_wiki_pages_per_direction: 5
max_factor_codes_per_direction: 3

# 动态调整
freeze_after_n_failures: 3

# Claude Agent 权限模式
# bypassPermissions: 跳过授权（默认）, auto: 自动确认, default: 手动授权
permission_mode: "bypassPermissions"
