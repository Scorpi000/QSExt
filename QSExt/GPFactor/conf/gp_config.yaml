# -*- coding: utf-8 -*-
# GPLearn 配置文件模板。
#
# 使用方式：
#     from QSExt.GPFactor.GPLearn import GPLearner
#
#     learner = GPLearner(
#         operator_list=[...],
#         terminal_factors=[...],
#         fitness_fun=my_func,
#         config_file="QSExt/GPFactor/conf/gp_config.yaml",
#     )
#     populations, fitness, ancestry = learner.evolve()

# ============================================================
# 种群与进化
# ============================================================

# 种群大小
PopulationSize: 1000

# 锦标赛选择的参赛个体数
TournamentSize: 20

# ============================================================
# 初始化
# ============================================================

# 初始化深度范围
InitDepthMin: 2
InitDepthMax: 6

# 初始化方法: "half and half" / "full" / "grow"
InitMethod: "half and half"

# ============================================================
# 算子入参（对 Arity=None 的算子生效）
# ============================================================

# 最小入参数量
MinArity: 1

# 最大入参数量
MaxArity: 3

# ============================================================
# 常数
# ============================================================

# 是否生成常数节点
ConstRangeEnabled: true

# 常数范围
ConstRangeMin: -1.0
ConstRangeMax: 1.0

# ============================================================
# 遗传操作概率
# ============================================================

# 交叉概率
PCrossover: 0.9

# 子树变异概率
PSubtreeMutation: 0.01

# 提升变异概率（控制表达式膨胀）
PHoistMutation: 0.01

# 点变异概率
PPointMutation: 0.01

# 点变异替换比例（每个节点被替换的概率）
PPointReplace: 0.05

# ============================================================
# 复杂度惩罚
# ============================================================

# 复杂度惩罚系数（0 表示不惩罚）
ParsimonyCoefficient: 0.0

# ============================================================
# 进化参数
# ============================================================

# 进化代数
NGenerations: 10

# 并行任务数（当前未启用）
NJobs: 1

# 日志详细程度: 0=静默, 1=每代输出
Verbose: 0
